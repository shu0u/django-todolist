<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Выполненные задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">TODO Manager</a>
        <div class="ms-auto d-flex align-items-center">
            <span class="text-white me-3">Вы вошли как: <b>{{ user.username }}</b></span>
            <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm me-2">Все задачи</a>
            <form method="POST" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Выполненные задачи</h1>

    <ul class="list-group">
        {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="text-decoration-line-through text-muted">{{ task.title }}</span>
                <a href="{% url 'toggle_task' task.id %}" class="btn btn-sm btn-outline-secondary">Вернуть</a>
            </li>
        {% empty %}
            <li class="list-group-item text-center text-muted">Нет выполненных задач</li>
        {% endfor %}
    </ul>
</div>

</body>
</html>
