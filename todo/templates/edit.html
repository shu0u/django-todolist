<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование задачи</title>
</head>
<body>
    <h1>Редактировать задачу</h1>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" value="{{ task.title }}" required>
        <button type="submit">Сохранить</button>
        <a href="{% url 'home' %}">Отмена</a>
    </form>
</body>
</html>
